syntax = "proto3";

package hyperlooms.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/appalla-karthik/Hyperlooms/agents/provider/gen/hyperlooms/agent/v1;agentv1";
option java_multiple_files = true;
option java_package = "dev.hyperlooms.protocol.agent.v1";

// A single outbound, mTLS-authenticated session carries bounded agent control messages.
// The server must bind node_id to the authenticated client certificate identity.
service AgentSessionService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ConnectRequest {
  string message_id = 1;
  oneof body {
    AgentHello hello = 10;
    AgentHeartbeat heartbeat = 11;
    AgentLeaseReceipt lease_receipt = 12;
    AgentCommandStaged command_staged = 13;
  }
}

message ConnectResponse {
  string message_id = 1;
  oneof body {
    HelloAcknowledgement hello_acknowledgement = 10;
    HeartbeatAcknowledgement heartbeat_acknowledgement = 11;
    LeaseOffer lease_offer = 12;
    LeaseReceiptAcknowledgement lease_receipt_acknowledgement = 13;
    ExecutionCommand execution_command = 14;
    CommandStagedAcknowledgement command_staged_acknowledgement = 15;
  }
}

message AgentHello {
  string node_id = 1;
  uint32 protocol_version = 2;
  string agent_version = 3;
  repeated GpuCapability gpus = 4;
  google.protobuf.Timestamp reported_at = 5;
  // Opts in only to durable command staging, not container execution.
  bool supports_command_staging = 6;
}

// A report is not verification. The control plane validates claims before eligibility.
message GpuCapability {
  string gpu_uuid = 1;
  string model = 2;
  uint64 vram_bytes = 3;
  string driver_version = 4;
  string cuda_version = 5;
}

enum AvailabilityState {
  AVAILABILITY_STATE_UNSPECIFIED = 0;
  AVAILABILITY_STATE_OFFLINE = 1;
  AVAILABILITY_STATE_AVAILABLE = 2;
  AVAILABILITY_STATE_BUSY = 3;
  AVAILABILITY_STATE_DRAINING = 4;
}

message AgentHeartbeat {
  string node_id = 1;
  uint64 sequence = 2;
  AvailabilityState availability = 3;
  google.protobuf.Timestamp sent_at = 4;
}

enum HelloRejectionReason {
  HELLO_REJECTION_REASON_UNSPECIFIED = 0;
  HELLO_REJECTION_REASON_UNKNOWN_NODE = 1;
  HELLO_REJECTION_REASON_REVOKED_NODE = 2;
  HELLO_REJECTION_REASON_IDENTITY_MISMATCH = 3;
  HELLO_REJECTION_REASON_UNSUPPORTED_PROTOCOL = 4;
}

message HelloAcknowledgement {
  string request_message_id = 1;
  bool accepted = 2;
  HelloRejectionReason rejection_reason = 3;
  uint32 heartbeat_interval_seconds = 4;
  google.protobuf.Timestamp server_time = 5;
}

message HeartbeatAcknowledgement {
  string request_message_id = 1;
  google.protobuf.Timestamp server_time = 2;
}

// A transport offer only. Receipt does not authorize execution or extend the lease.
message LeaseOffer {
  string job_id = 1;
  string attempt_id = 2;
  string lease_id = 3;
  string node_id = 4;
  string gpu_uuid = 5;
  uint64 fencing_token = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message AgentLeaseReceipt {
  string node_id = 1;
  string lease_id = 2;
  uint64 fencing_token = 3;
}

message LeaseReceiptAcknowledgement {
  string request_message_id = 1;
  string lease_id = 2;
  google.protobuf.Timestamp server_time = 3;
}

// A fenced, immutable snapshot for local staging only. No artifact grant is included.
message ExecutionCommand {
  string command_id = 1;
  string job_id = 2;
  string attempt_id = 3;
  string lease_id = 4;
  string node_id = 5;
  string gpu_uuid = 6;
  uint64 fencing_token = 7;
  google.protobuf.Timestamp expires_at = 8;
  string image_repository = 9;
  string image_digest = 10;
  uint32 max_runtime_seconds = 11;
  string verified_input_prefix = 12;
  string input_manifest_sha256 = 13;
  uint32 input_file_count = 14;
  uint64 input_total_bytes = 15;
}

message AgentCommandStaged {
  string node_id = 1;
  string lease_id = 2;
  string command_id = 3;
  uint64 fencing_token = 4;
}

message CommandStagedAcknowledgement {
  string request_message_id = 1;
  string command_id = 2;
  google.protobuf.Timestamp server_time = 3;
}
