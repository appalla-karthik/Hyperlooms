spring:
  application:
    name: hyperlooms-control-plane
    version: ${HYPERLOOMS_VERSION:development}
  datasource:
    url: ${HYPERLOOMS_DATABASE_URL:jdbc:postgresql://localhost:5432/hyperlooms}
    username: ${HYPERLOOMS_DATABASE_USER:hyperlooms}
    password: ${HYPERLOOMS_DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: ${HYPERLOOMS_DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${HYPERLOOMS_CONTROL_PLANE_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  observations:
    key-values:
      service: hyperlooms-control-plane

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

hyperlooms:
  scheduler:
    enabled: ${HYPERLOOMS_SCHEDULER_ENABLED:false}
    poll-interval-ms: ${HYPERLOOMS_SCHEDULER_POLL_INTERVAL_MS:5000}
  requester-api:
    enabled: ${HYPERLOOMS_REQUESTER_API_ENABLED:false}
    issuer-uri: ${HYPERLOOMS_REQUESTER_ISSUER_URI:}
    jwk-set-uri: ${HYPERLOOMS_REQUESTER_JWK_SET_URI:}
    audience: ${HYPERLOOMS_REQUESTER_AUDIENCE:}
    allow-insecure-local-issuer: ${HYPERLOOMS_REQUESTER_ALLOW_INSECURE_LOCAL_ISSUER:false}
    storage:
      bucket: ${HYPERLOOMS_ARTIFACT_BUCKET:}
      region: ${HYPERLOOMS_S3_REGION:us-east-1}
      endpoint: ${HYPERLOOMS_S3_ENDPOINT:}
      path-style: ${HYPERLOOMS_S3_PATH_STYLE:false}
      allow-insecure-local-endpoint: ${HYPERLOOMS_S3_ALLOW_INSECURE_LOCAL:false}
      access-key: ${HYPERLOOMS_S3_ACCESS_KEY:}
      secret-key: ${HYPERLOOMS_S3_SECRET_KEY:}
  lease-expiry:
    enabled: ${HYPERLOOMS_LEASE_EXPIRY_ENABLED:false}
    poll-interval-ms: ${HYPERLOOMS_LEASE_EXPIRY_POLL_INTERVAL_MS:5000}
  agent-grpc:
    enabled: ${HYPERLOOMS_AGENT_GRPC_ENABLED:false}
    port: ${HYPERLOOMS_AGENT_GRPC_PORT:9090}
    certificate: ${HYPERLOOMS_AGENT_GRPC_CERTIFICATE:}
    private-key: ${HYPERLOOMS_AGENT_GRPC_PRIVATE_KEY:}
    client-ca: ${HYPERLOOMS_AGENT_GRPC_CLIENT_CA:}
