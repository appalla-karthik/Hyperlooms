name: hyperlooms-foundation

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HYPERLOOMS_POSTGRES_DB:-hyperlooms}
      POSTGRES_USER: ${HYPERLOOMS_POSTGRES_USER:-hyperlooms}
      POSTGRES_PASSWORD: ${HYPERLOOMS_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${HYPERLOOMS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hyperlooms-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hyperlooms-local

  object-storage:
    # Official SeaweedFS MinIO-compatible adapter; separate volume from old MinIO data.
    image: ghcr.io/seaweedfs/minio-compat:latest@sha256:7dc586b4e00e8afc495471b06c704f70abe08ff97229e8b9e263c76c05f7051e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HYPERLOOMS_S3_ACCESS_KEY:-hyperlooms-local}
      MINIO_ROOT_PASSWORD: ${HYPERLOOMS_S3_SECRET_KEY:-local-development-only-change-me}
    ports:
      - "${HYPERLOOMS_S3_API_PORT:-9000}:9000"
      - "${HYPERLOOMS_S3_ADMIN_PORT:-9001}:9001"
    volumes:
      - hyperlooms-seaweedfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hyperlooms-local

  artifact-bootstrap:
    image: amazon/aws-cli:2.41.0@sha256:c5d442efed03350a3c3d7a42b23f42a8e7b76acf5dbb4b021f2641bcd36680ea
    restart: "no"
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${HYPERLOOMS_S3_ACCESS_KEY:-hyperlooms-local}
      AWS_SECRET_ACCESS_KEY: ${HYPERLOOMS_S3_SECRET_KEY:-local-development-only-change-me}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      HYPERLOOMS_ARTIFACT_BUCKET: ${HYPERLOOMS_ARTIFACT_BUCKET:-hyperlooms-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        endpoint=http://object-storage:9000
        if ! aws --endpoint-url "$${endpoint}" s3api head-bucket --bucket "$${HYPERLOOMS_ARTIFACT_BUCKET}" >/dev/null 2>&1; then
          aws --endpoint-url "$${endpoint}" s3api create-bucket --bucket "$${HYPERLOOMS_ARTIFACT_BUCKET}"
        fi
        aws --endpoint-url "$${endpoint}" s3api head-bucket --bucket "$${HYPERLOOMS_ARTIFACT_BUCKET}"
        aws --endpoint-url "$${endpoint}" s3api put-object --bucket "$${HYPERLOOMS_ARTIFACT_BUCKET}" --key .phase-zero-probe --body /etc/hostname >/dev/null
        aws --endpoint-url "$${endpoint}" s3api get-object --bucket "$${HYPERLOOMS_ARTIFACT_BUCKET}" --key .phase-zero-probe /tmp/hyperlooms-phase-zero-probe >/dev/null
        cmp -s /etc/hostname /tmp/hyperlooms-phase-zero-probe
        aws --endpoint-url "$${endpoint}" s3api delete-object --bucket "$${HYPERLOOMS_ARTIFACT_BUCKET}" --key .phase-zero-probe >/dev/null
    networks:
      - hyperlooms-local

volumes:
  hyperlooms-postgres:
  hyperlooms-seaweedfs:

networks:
  hyperlooms-local:
    driver: bridge
