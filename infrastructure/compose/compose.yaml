name: hyperlooms-foundation

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HYPERLOOMS_POSTGRES_DB:-hyperlooms}
      POSTGRES_USER: ${HYPERLOOMS_POSTGRES_USER:-hyperlooms}
      POSTGRES_PASSWORD: ${HYPERLOOMS_POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${HYPERLOOMS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - hyperlooms-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hyperlooms-local

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${HYPERLOOMS_MINIO_ROOT_USER:-hyperlooms-local}
      MINIO_ROOT_PASSWORD: ${HYPERLOOMS_MINIO_ROOT_PASSWORD:-local-development-only-change-me}
    ports:
      - "${HYPERLOOMS_MINIO_API_PORT:-9000}:9000"
      - "${HYPERLOOMS_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - hyperlooms-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hyperlooms-local

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${HYPERLOOMS_MINIO_ROOT_USER:-hyperlooms-local}
      MINIO_ROOT_PASSWORD: ${HYPERLOOMS_MINIO_ROOT_PASSWORD:-local-development-only-change-me}
      HYPERLOOMS_ARTIFACT_BUCKET: ${HYPERLOOMS_ARTIFACT_BUCKET:-hyperlooms-artifacts}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${HYPERLOOMS_ARTIFACT_BUCKET}"
        mc anonymous set none "local/$${HYPERLOOMS_ARTIFACT_BUCKET}"
    networks:
      - hyperlooms-local

volumes:
  hyperlooms-postgres:
  hyperlooms-minio:

networks:
  hyperlooms-local:
    driver: bridge
