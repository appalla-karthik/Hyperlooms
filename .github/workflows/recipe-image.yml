name: Signed PyTorch recipe image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-amd64:
    name: Build and sign Linux amd64 recipe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Build and publish exact source image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: workloads/recipes/linear-regression-v1
          platforms: linux/amd64
          push: true
          tags: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Sign immutable digest with GitHub OIDC
        env:
          IMAGE: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify signature identity and record digest
        env:
          IMAGE: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity 'https://github.com/appalla-karthik/Hyperlooms/.github/workflows/recipe-image.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE@$DIGEST" >/dev/null
          echo "Verified image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Not APPROVED for GPU execution until a qualified Linux NVIDIA host smoke passes.' >> "$GITHUB_STEP_SUMMARY"

  published-image-cpu-smoke:
    name: Published image restricted CPU smoke
    needs: build-sign-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact signed candidate and exercise input/output contract
        env:
          IMAGE: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1
          DIGEST: ${{ needs.build-sign-amd64.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          result_dir="$(mktemp -d)"
          container_id=''
          cleanup() {
            if [ -n "$container_id" ]; then docker rm -f "$container_id" >/dev/null 2>&1 || true; fi
            rm -f -- "$result_dir/result.json"
            rmdir -- "$result_dir"
          }
          trap cleanup EXIT
          container_id="$(docker create \
            --pull=never --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges=true --pids-limit=256 \
            --memory=4g --memory-swap=4g --user=65532:65532 \
            --tmpfs=/tmp:rw,nosuid,nodev,size=64m \
            --tmpfs=/outputs:rw,nosuid,nodev,noexec,size=4m,mode=1777 \
            --mount="type=bind,src=$PWD/workloads/recipes/linear-regression-v1/example-request.json,dst=/inputs/request.json,readonly" \
            "$IMAGE@$DIGEST" --device cpu)"
          docker start "$container_id" >/dev/null
          status="$(docker wait "$container_id")"
          docker logs "$container_id"
          test "$status" = '0'
          docker cp "$container_id:/outputs/result.json" "$result_dir/result.json"
          python -c 'import json, math, sys; x=json.load(open(sys.argv[1], encoding="utf-8")); assert x["schemaVersion"] == 1 and x["device"] == "cpu" and math.isfinite(x["meanSquaredError"])' "$result_dir/result.json"
          echo "Restricted CPU image smoke passed: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'CPU smoke is not CUDA/NVIDIA host qualification.' >> "$GITHUB_STEP_SUMMARY"
