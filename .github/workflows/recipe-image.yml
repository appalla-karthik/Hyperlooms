name: Signed PyTorch recipe image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-amd64:
    name: Build and sign Linux amd64 recipe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Build and publish exact source image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: workloads/recipes/linear-regression-v1
          platforms: linux/amd64
          push: true
          tags: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Sign immutable digest with GitHub OIDC
        env:
          IMAGE: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Verify signature identity and record digest
        env:
          IMAGE: ghcr.io/appalla-karthik/hyperlooms-linear-regression-v1
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity 'https://github.com/appalla-karthik/Hyperlooms/.github/workflows/recipe-image.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$IMAGE@$DIGEST" >/dev/null
          echo "Verified image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Not APPROVED for GPU execution until a qualified Linux NVIDIA host smoke passes.' >> "$GITHUB_STEP_SUMMARY"
