name: Engineering quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - run: bash ./gradlew --no-daemon clean test bootJar

  provider-agent:
    name: Provider agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/provider/go.mod
          cache-dependency-path: agents/provider/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath ./cmd/hyperlooms-agent

  jetson-agent-build:
    name: Experimental Jetson ARM64 agent build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/provider
    steps:
      - uses: actions/checkout@v4
      - name: Validate Jetson diagnostic shell scripts
        run: bash -n ../../scripts/jetson-host-survey.sh ../../scripts/jetson-container-smoke.sh ../../scripts/jetson-restricted-cuda-smoke.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/provider/go.mod
          cache-dependency-path: agents/provider/go.sum
      - name: Cross-compile static Linux ARM64 agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/hyperlooms-agent-linux-arm64 ./cmd/hyperlooms-agent
          file dist/hyperlooms-agent-linux-arm64
          file dist/hyperlooms-agent-linux-arm64 | grep -q 'ARM aarch64'
          cd dist
          sha256sum hyperlooms-agent-linux-arm64 > hyperlooms-agent-linux-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hyperlooms-agent-linux-arm64-experimental
          path: |
            agents/provider/dist/hyperlooms-agent-linux-arm64
            agents/provider/dist/hyperlooms-agent-linux-arm64.sha256
          retention-days: 7

  python-sdk:
    name: Python workload SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workloads/python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  pytorch-recipe:
    name: PyTorch recipe CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workloads/recipes/linear-regression-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s . -p 'test_*.py' -v

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        timeout-minutes: 10
      - run: pnpm build

  infrastructure:
    name: Infrastructure definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infrastructure/compose/compose.yaml config --quiet
      - run: python -m unittest discover -s infrastructure/identity -p 'test_*.py' -v

  identity-provider:
    name: Local OIDC and requester API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - run: docker compose -f infrastructure/compose/compose.yaml up -d --wait postgres
      - run: docker compose -f infrastructure/compose/compose.yaml --profile identity up -d identity-provider
      - name: Wait for imported realm
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:8180/realms/hyperlooms-dev/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f infrastructure/compose/compose.yaml --profile identity logs identity-provider
          exit 1
      - run: bash ./gradlew --no-daemon bootJar
        working-directory: services/control-plane
      - name: Start authenticated control plane
        run: |
          java -jar services/control-plane/build/libs/hyperlooms-control-plane-0.1.0-SNAPSHOT.jar >"$RUNNER_TEMP/identity-api.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/identity-api.pid"
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 "$RUNNER_TEMP/identity-api.log"
          exit 1
        env:
          HYPERLOOMS_REQUESTER_API_ENABLED: "true"
          HYPERLOOMS_REQUESTER_ISSUER_URI: http://localhost:8180/realms/hyperlooms-dev
          HYPERLOOMS_REQUESTER_JWK_SET_URI: http://localhost:8180/realms/hyperlooms-dev/protocol/openid-connect/certs
          HYPERLOOMS_REQUESTER_AUDIENCE: hyperlooms-api
          HYPERLOOMS_REQUESTER_ALLOW_INSECURE_LOCAL_ISSUER: "true"
          HYPERLOOMS_ARTIFACT_BUCKET: hyperlooms-artifacts
          HYPERLOOMS_S3_ACCESS_KEY: hyperlooms-local
          HYPERLOOMS_S3_SECRET_KEY: local-development-only-change-me
      - run: python infrastructure/identity/smoke.py --api-base http://localhost:8080
        env:
          HYPERLOOMS_IDENTITY_ADMIN_PASSWORD: local-development-only-change-me
      - name: Stop control plane
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/identity-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/identity-api.pid")" 2>/dev/null || true
          fi

  agent-protocol:
    name: Agent protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: "1.50.0"
      - run: buf format --diff --exit-code
        working-directory: proto
      - run: buf lint
        working-directory: proto
      - run: buf build
        working-directory: proto
      - run: buf generate
        working-directory: proto
      - run: test -z "$(git status --porcelain -- agents/provider/gen)"

  foundation-smoke:
    name: Live PostgreSQL and S3 smoke
    runs-on: ubuntu-latest
    needs: [control-plane, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - run: bash scripts/verify-phase-zero-stack.sh
        timeout-minutes: 10
      - run: bash scripts/verify-phase-one-schema.sh
        timeout-minutes: 2
      - run: bash ./gradlew --no-daemon integrationTest
        working-directory: services/control-plane
        timeout-minutes: 5

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
